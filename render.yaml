services:
  - type: web
    name: economy-bot
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: OWNER_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/economy.sqlite
    disk:
      name: economy-data
      mountPath: /data
      sizeGB: 1
